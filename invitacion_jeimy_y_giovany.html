    <style>
        :root {
            --bg-warm: #FFFFFF;
            --pink-soft: #FFB7C5;
            --pink-dark: #E85A71;
            --blue-soft: #A2D5F2;
            --blue-dark: #457B9D;
            --yellow-soft: #FFE699;
            --brown-bear: #8D5B4C;
            --text-main: #5C4033;
        }

        /* FONDO DIVIDIDO ROSA Y AZUL SUAVE */
        body {
            background: linear-gradient(to right, #FDF0F3 50%, #EBF5FB 50%);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--bg-warm);
            width: 100%;
            max-width: 440px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            padding: 30px 20px 25px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            background-image: radial-gradient(#FFF1F3 2px, transparent 2px), radial-gradient(#F0F8FC 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* ENCABEZADO "GIRL OR BOY" */
        .header-title {
            margin-bottom: -5px;
            position: relative;
            z-index: 2;
        }
        .title-girl {
            font-family: 'Caveat', cursive;
            font-size: 4.5rem;
            color: var(--pink-dark);
            line-height: 0.7;
            display: inline-block;
            margin-right: 15px;
            transform: rotate(-5deg);
        }
        .title-or {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: var(--brown-bear);
            display: inline-block;
        }
        .title-boy {
            font-family: 'Caveat', cursive;
            font-size: 4.5rem;
            color: var(--blue-dark);
            line-height: 0.7;
            display: inline-block;
            margin-left: 15px;
            transform: rotate(5deg);
        }

        /* ILUSTRACIÓN DE OSITOS */
        .illustration-container {
            width: 100%;
            max-width: 360px;
            margin: 5px auto 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }
        .bear-svg {
            width: 48%;
            height: auto;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.08));
        }

        /* TARJETA DEL INVITADO */
        .guest-box {
            margin-bottom: 5px;
            padding: 10px;
        }
        .guest-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.6rem;
            color: var(--brown-bear);
            margin: 0;
            text-transform: capitalize;
        }

        /* SECCIÓN DE FECHA */
        .date-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 20px;
        }
        .date-side {
            width: 85px;
            padding: 8px 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .date-side.left {
            color: var(--pink-dark);
            border-top: 2px solid var(--pink-soft);
            border-bottom: 2px solid var(--pink-soft);
        }
        .date-side.right {
            color: var(--blue-dark);
            border-top: 2px solid var(--blue-soft);
            border-bottom: 2px solid var(--blue-soft);
        }
        .date-center {
            margin: 0 10px;
            padding: 0 15px;
            border-left: 2px dotted #DDD;
            border-right: 2px dotted #DDD;
        }
        .date-center .month {
            font-size: 1rem;
            color: var(--brown-bear);
            font-weight: 700;
        }
        .date-center .day {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.5rem;
            color: var(--pink-dark);
            line-height: 0.9;
            font-weight: 700;
        }

        /* UBICACIÓN */
        .location-info {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* TARJETAS DE APUESTA */
        .bets-title {
            font-family: 'Fredoka', sans-serif;
            color: var(--brown-bear);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .bets-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .bet-card {
            flex: 1;
            border-radius: 20px;
            padding: 15px 5px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid transparent;
        }
        .bet-card strong {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        .bet-card span {
            font-size: 0.75rem;
            font-weight: 700;
            display: block;
            line-height: 1.3;
        }

        .bet-boy { background-color: #EBF5FB; color: #1B4965; border-color: #A2D5F2; }
        .bet-girl { background-color: #FDF0F3; color: #800F2F; border-color: #FFB7C5; }
        .bet-idc { background-color: #FFF9E6; color: #705200; border-color: #FFE699; }

        .dynamic-diaper {
            background-color: #FFFFFF;
            color: #1B4965;
            padding: 3px 8px;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 0.75rem !important;
            font-weight: 900 !important;
            border: 1px dashed #A2D5F2;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* BOTONES INTERACTIVOS */
        .btn {
            font-family: 'Fredoka', sans-serif;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        
        .btn-map { 
            background-color: #F4F4F4; 
            color: var(--blue-dark); 
            margin-top: 10px;
            border: 1px solid #D6E4ED;
        }
        
        .btn-wa { 
            background-color: #25D366; 
            color: #FFFFFF; 
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            margin-top: 10px;
        }

        /* MENSAJE FINAL */
        .closing-text {
            font-family: 'Caveat', cursive;
            font-size: 1.9rem;
            color: var(--brown-bear);
            margin: 20px 0 5px 0;
            font-weight: 700;
        }

    </style>
